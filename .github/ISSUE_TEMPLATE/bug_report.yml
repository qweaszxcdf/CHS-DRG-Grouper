name: Bug 报告
description: 使用不含病案身份信息的数据报告可复现的软件问题。
body:
  - type: markdown
    attributes:
      value: 请勿包含可识别个人身份的病案数据、凭据或受限规则数据。
  - type: input
    id: version
    attributes:
      label: 项目版本和规则版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请使用去标识化或合成数据，并提供预期结果、实际结果和 matchTrace。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请提供浏览器或 Node.js 版本及操作系统。
    validations:
      required: true
